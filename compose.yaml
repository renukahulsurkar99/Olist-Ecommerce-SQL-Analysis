services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: analyst
      POSTGRES_DB: olist_analytics
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - olist_pgdata:/var/lib/postgresql/data
      - .:/project:ro
    working_dir: /project
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analyst -d olist_analytics"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  olist_pgdata:
